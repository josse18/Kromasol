<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Premium - Kromasol</title>
    <style>
        /* =========================================
           VARIABLES Y ESTILOS GENERALES (Paleta Elegante)
           ========================================= */
        :root {
            --primary-color: #9b1130; /* Borgoña / Vino elegante */
            --primary-hover: #720d22;
            --accent-gold: #c5a059;   /* Dorado sutil corporativo */
            --bg-color: #faf9f6;      /* Marfil suave */
            --card-bg: #ffffff;
            --text-main: #2c2c2c;
            --text-muted: #666666;
            --star-color: #c5a059;
            --transition-slow: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cinzel', 'Garamond', 'Segoe UI', serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            letter-spacing: 0.3px;
        }

        /* --- Animaciones fluidas y pausadas --- */
        .reveal {
            opacity: 0;
            transform: translateY(60px);
            transition: var(--transition-slow);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* =========================================
           CABECERA (HEADER) - ESTILO LUJO LENTO
           ========================================= */
        header {
            background: linear-gradient(135deg, #1a1a1a, #2d2024);
            color: white;
            text-align: center;
            padding: 7rem 1.5rem;
            border-bottom: 3px solid var(--accent-gold);
            position: relative;
            overflow: hidden;
        }

        .header-title {
            font-size: 3.5rem;
            margin-bottom: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .subtitle-text {
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 4px;
            color: #d1d1d1;
            opacity: 0;
            transform: translateY(-30px);
            animation: slowFadeDown 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.4s;
            text-transform: uppercase;
        }

        .brand-text {
            font-size: 4.2rem;
            font-weight: 700;
            letter-spacing: 6px;
            color: var(--accent-gold);
            opacity: 0;
            transform: scale(0.95);
            animation: slowZoomIn 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 1s;
            text-transform: uppercase;
        }

        .header-desc {
            font-size: 1.15rem;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 300;
            color: #b5b5b5;
            max-width: 650px;
            margin: 0 auto;
            opacity: 0;
            animation: slowFadeUp 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards 1.8s;
            line-height: 1.8;
        }

        /* Keyframes de alta gama y temporización pausada */
        @keyframes slowFadeDown {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slowZoomIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slowFadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================
           SECCIONES Y TÍTULOS
           ========================================= */
        section {
            max-width: 1250px;
            margin: 6rem auto;
            padding: 0 2rem;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            color: var(--text-main);
            margin-bottom: 3rem;
            font-weight: 400;
            letter-spacing: 2px;
            position: relative;
            text-transform: uppercase;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 2px;
            background-color: var(--accent-gold);
            margin: 1rem auto 0;
        }

        /* =========================================
           SISTEMA DE FILTROS MINIMALISTA
           ========================================= */
        .filters-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        .filter-btn {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid #dcdcdc;
            padding: 0.8rem 2rem;
            border-radius: 4px;
            font-size: 0.95rem;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            box-shadow: 0 8px 25px rgba(155, 17, 48, 0.2);
        }

        /* =========================================
           CUADRÍCULA DE PRODUCTOS (ESTILO TARJETA PREMIUM)
           ========================================= */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 3rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #eaeaea;
            box-shadow: 0 15px 35px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.08);
            border-color: var(--accent-gold);
        }

        .card-img-container {
            width: 100%;
            height: 260px;
            overflow: hidden;
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .product-img {
            width: 85%;
            height: 85%;
            object-fit: contain;
            transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover .product-img {
            transform: scale(1.06);
        }

        .category-badge {
            position: absolute;
            top: 1.2rem;
            right: 1.2rem;
            background-color: rgba(26, 26, 26, 0.85);
            backdrop-filter: blur(5px);
            color: var(--accent-gold);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 2;
        }

        .card-content {
            padding: 2.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 1rem;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .card-desc {
            font-size: 0.95rem;
            font-family: 'Segoe UI', sans-serif;
            line-height: 1.8;
            margin-bottom: 1.8rem;
            color: var(--text-muted);
        }

        .card-benefits {
            margin-bottom: 2.5rem;
            padding-left: 1.2rem;
            font-size: 0.9rem;
            font-family: 'Segoe UI', sans-serif;
            color: #4a4a4a;
            flex-grow: 1;
        }

        .card-benefits li {
            margin-bottom: 0.6rem;
            line-height: 1.5;
        }

        .btn-info {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%;
            margin-top: auto;
            text-decoration: none;
            text-align: center;
            display: block;
        }

        .btn-info:hover {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 10px 25px rgba(155, 17, 48, 0.25);
        }

        /* =========================================
           SECCIÓN DE RESEÑAS (ESTILO EDITORIAL)
           ========================================= */
        .reviews-section-container {
            background-color: #f2f0eb;
            padding: 6rem 0;
            border-top: 1px solid #e2ded5;
            border-bottom: 1px solid #e2ded5;
        }

        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem;
            max-width: 1250px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .review-card {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 6px;
            border-left: 3px solid var(--accent-gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .review-card:hover {
            transform: translateY(-6px);
        }

        .product-tag {
            display: inline-block;
            background-color: #f7f5f0;
            color: var(--text-main);
            padding: 0.3rem 0.9rem;
            border-radius: 15px;
            font-size: 0.75rem;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 1.2rem;
            text-transform: uppercase;
        }

        .stars {
            color: var(--star-color);
            font-size: 1.2rem;
            margin-bottom: 1.2rem;
            letter-spacing: 3px;
        }

        .review-text {
            font-style: italic;
            font-size: 1.05rem;
            color: #444444;
            line-height: 1.8;
            margin-bottom: 1.8rem;
        }

        .review-author {
            display: flex;
            align-items: center;
            font-weight: 600;
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.95rem;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .review-author::before {
            content: '';
            display: inline-block;
            width: 25px;
            height: 1px;
            background-color: var(--accent-gold);
            margin-right: 12px;
        }

        /* =========================================
           PIE DE PÁGINA (FOOTER)
           ========================================= */
        footer {
            text-align: center;
            padding: 4rem 1rem;
            background-color: #1a1a1a;
            color: #888;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 300;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- CABECERA CON ANIMACIÓN LENTA Y SOLEMNE -->
    <header>
        <div class="header-title">
            <span class="subtitle-text">Bienestar y Nutrición</span>
            <span class="brand-text">Kromasol</span>
        </div>
        <p class="header-desc">Colección exclusiva de suplementos formulados para elevar su calidad de vida con estándares internacionales.</p>
    </header>

    <!-- SECCIÓN DE PRODUCTOS Y FILTROS -->
    <section id="productos">
        <h2 class="section-title reveal">Catálogo Selecto</h2>
        
        <div class="filters-container reveal">
            <button class="filter-btn active" data-filter="Todos">Todos</button>
            <button class="filter-btn" data-filter="Energía">Energía</button>
            <button class="filter-btn" data-filter="Nutrición">Nutrición</button>
            <button class="filter-btn" data-filter="Control de Peso">Control de Peso</button>
            <button class="filter-btn" data-filter="Digestión">Digestión</button>
        </div>

        <div class="products-grid" id="products-container">
            <!-- Los productos se inyectarán dinámicamente aquí -->
        </div>
    </section>

    <!-- SECCIÓN DE RESEÑAS EDITORIALES -->
    <div class="reviews-section-container">
        <h2 class="section-title reveal">Testimonios Distinguidos</h2>
        <div class="reviews-grid" id="reviews-container">
            <!-- Las reseñas se inyectarán dinámicamente aquí -->
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Catálogo Independiente Kromasol. Excelencia y Bienestar.</p>
    </footer>

    <!-- =========================================
         SCRIPT DE FUNCIONALIDAD Y APARICIÓN LENTA
         ========================================= -->
    <script>
        const productos = [
            {
                nombre: "Supernova",
                categoria: "Energía",
                descripcion: "Polvo para preparar una bebida energética de alta gama sabor cereza.",
                beneficios: ["Contiene complejo B y Zinc de alta pureza", "Proporciona vitalidad física y mental prolongada", "Optimiza el rendimiento diario sin fatiga"],
                imagen: "Supernova.webp",
                resenas: [
                    { usuario: "Carlos M.", texto: "La diferencia en mi rendimiento diario es notable. Una fórmula sofisticada y efectiva.", estrellas: 5 },
                    { usuario: "Elena R.", texto: "Indispensable en mis mañanas para mantener un enfoque absoluto.", estrellas: 5 }
                ]
            },
            {
                nombre: "Kosmos",
                categoria: "Nutrición",
                descripcion: "Suplemento multivitamínico con antioxidantes y oligoelementos esenciales.",
                beneficios: ["Fortalece el sistema inmunológico con elegancia biológica", "Alto contenido de antioxidantes celulares", "Complemento ideal para un estilo de vida exigente"],
                imagen: "Kosmos by Kromasol Regenerador celular….webp",
                resenas: [
                    { usuario: "Javier T.", texto: "Se nota el rigor en la calidad de sus componentes. Mi bienestar general ha escalado.", estrellas: 5 }
                ]
            },
            {
                nombre: "Vesta",
                categoria: "Digestión",
                descripcion: "Concentrado líquido refinado a base de pulpa de Sábila y Astaxantina.",
                beneficios: ["Armoniza de forma óptima la salud digestiva", "Notable capacidad antiinflamatoria natural", "Enriquecido con antioxidantes y Vitamina C"],
                imagen: "Vesta by kromasol - goji, astaxantina y pulpa de sábila (1 lt).webp",
                resenas: [
                    { usuario: "María F.", texto: "Un alivio estomacal inmediato con un perfil de sabor sumamente agradable.", estrellas: 5 },
                    { usuario: "Roberto G.", texto: "La pureza de sus ingredientes se percibe desde la primera toma.", estrellas: 5 }
                ]
            },
            {
                nombre: "Nox",
                categoria: "Control de Peso",
                descripcion: "Bebida aromática sabor capuchino o café gourmet para la gestión corporal.",
                beneficios: ["Formulado con L-Carnitina y Hongo Shiitake selecto", "Estimula el metabolismo de manera sutil", "Incluye fibra soluble de inulina de agave"],
                imagen: "Nox - Kromasol Distribuidores.webp",
                resenas: [
                    { usuario: "Silvia L.", texto: "Sustituyó perfectamente mi café habitual. Me otorga control y ligereza.", estrellas: 5 }
                ]
            },
            {
                nombre: "Antara",
                categoria: "Nutrición",
                descripcion: "Polvo proteico avanzado para la recuperación y nutrición integral.",
                beneficios: ["Excelente como alternativa nutricional balanceada", "Facilita la recuperación física y muscular", "Genera una prolongada y placentera saciedad"],
                imagen: "Antara.webp",
                resenas: [
                    { usuario: "Andrés V.", texto: "Su textura y digestibilidad superan por completo a cualquier otro suplemento común.", estrellas: 5 }
                ]
            }
        ];

        const productsContainer = document.getElementById('products-container');
        const reviewsContainer = document.getElementById('reviews-container');
        const filterBtns = document.querySelectorAll('.filter-btn');

        const numeroWhatsApp = "593999999999"; 

        // Observer configurado con umbral más alto para un despliegue visual lento y solemne
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.15
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    setTimeout(() => {
                        entry.target.classList.add('active');
                    }, 150); // Retardo deliberado para lentitud elegante
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);

        function renderizarCatalogo(filtro) {
            productsContainer.innerHTML = ''; 
            reviewsContainer.innerHTML = ''; 
            
            const productosFiltrados = filtro === 'Todos' 
                ? productos 
                : productos.filter(p => p.categoria === filtro);

            productosFiltrados.forEach(producto => {
                const beneficiosHTML = producto.beneficios.map(b => `<li>${b}</li>`).join('');
                
                const textoMensaje = `Estimados, deseo recibir información exclusiva sobre el producto ${producto.nombre}.`;
                const urlWhatsApp = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(textoMensaje)}`;
                
                const cardProduct = document.createElement('div');
                cardProduct.className = 'card reveal'; 
                cardProduct.innerHTML = `
                    <div style="position: relative;">
                        <span class="category-badge">${producto.categoria}</span>
                        <div class="card-img-container">
                            <img src="${producto.imagen}" alt="Producto ${producto.nombre}" class="product-img">
                        </div>
                    </div>
                    <div class="card-content">
                        <h2 class="card-title">${producto.nombre}</h2>
                        <p class="card-desc">${producto.descripcion}</p>
                        <ul class="card-benefits">
                            ${beneficiosHTML}
                        </ul>
                        <a href="${urlWhatsApp}" target="_blank" class="btn-info">
                            Solicitar Información
                        </a>
                    </div>
                `;
                
                productsContainer.appendChild(cardProduct);
                observer.observe(cardProduct);

                if(producto.resenas) {
                    producto.resenas.forEach(resena => {
                        const cardReview = document.createElement('div');
                        cardReview.className = 'review-card reveal';
                        cardReview.innerHTML = `
                            <span class="product-tag">${producto.nombre}</span>
                            <div class="stars">${'&#9733;'.repeat(resena.estrellas)}</div>
                            <p class="review-text">"${resena.texto}"</p>
                            <span class="review-author">${resena.usuario}</span>
                        `;
                        reviewsContainer.appendChild(cardReview);
                        observer.observe(cardReview);
                    });
                }
            });
        }

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const filtro = btn.getAttribute('data-filter');
                renderizarCatalogo(filtro);
            });
        });

        document.addEventListener("DOMContentLoaded", () => {
            renderizarCatalogo('Todos');
            
            document.querySelectorAll('.section-title.reveal, .filters-container.reveal').forEach(el => {
                observer.observe(el);
            });
        });
    </script>
</body>
</html>
